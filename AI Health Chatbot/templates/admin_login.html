<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login - HealthAware AI</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            padding: 20px;
        }
        .admin-login-card {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            border-radius: var(--radius-lg);
            max-width: 440px;
            width: 100%;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .admin-badge-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: white;
            margin: 0 auto 16px;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
        }
        .admin-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }
        .admin-input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.25);
        }
        .credentials-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 20px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="admin-login-card">
        <div style="text-align: center; margin-bottom: 24px;">
            <div class="admin-badge-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1 style="font-size: 1.6rem; color: white; margin-bottom: 6px;">Admin Control Console</h1>
            <p style="color: #94a3b8; font-size: 0.85rem;">Restricted to authorized public-health staff and AI engineers</p>
        </div>

        {% if error %}
        <div style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 12px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 20px;">
            <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('admin_login') }}">
            <div style="margin-bottom: 18px;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #cbd5e1;">Admin Email Address</label>
                <input type="email" name="email" required placeholder="admin@healthbot.org" class="admin-input">
            </div>

            <div style="margin-bottom: 24px;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #cbd5e1;">Admin Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="admin-input">
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 12px; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); font-size: 1rem;">
                <i class="fa-solid fa-lock-open"></i> Authenticate & Enter Console
            </button>
        </form>

        <div class="credentials-pill">
            <strong style="color: #cbd5e1;"><i class="fa-solid fa-key"></i> Default Admin Credentials:</strong><br>
            Email: <code style="color: #a5b4fc;">admin@healthbot.org</code> &bull; Password: <code style="color: #a5b4fc;">admin123</code>
        </div>

        <div style="text-align: center; margin-top: 24px;">
            <a href="{{ url_for('index') }}" style="color: #94a3b8; font-size: 0.85rem;">
                <i class="fa-solid fa-arrow-left"></i> Return to Public Health Chatbot
            </a>
        </div>
    </div>
</body>
</html>
